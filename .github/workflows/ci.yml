name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Run actionlint
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci.yml
          .github/workflows/codeql.yml

  minimum-macos:
    name: Swift 6.1 / macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Restore SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: >-
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show toolchain
        run: swift --version
      - name: Test debug
        run: swift test --scratch-path .build/ci-minimum-debug
      - name: Test release
        run: swift test -c release --scratch-path .build/ci-minimum-release
  current-macos:
    name: Current Swift / macOS arm64
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Restore SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: >-
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Show toolchain
        run: swift --version
      - name: Test debug
        run: swift test --scratch-path .build/ci-current-debug
      - name: Test release
        run: swift test -c release --scratch-path .build/ci-current-release
  linux:
    name: Swift 6.1 / Ubuntu 24.04 / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: swift:6.1.3-noble@sha256:e1cdaf7ddc9de37d8561da7a260535236694fca8c1b67d3129d47d8b180a9394
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Restore SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: >-
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Show toolchain
        run: swift --version
      - name: Test debug
        run: swift test --scratch-path .build/ci-linux-debug
      - name: Test release
        run: swift test -c release --scratch-path .build/ci-linux-release
  android:
    name: Swift 6.3.3 / Android / x86_64 + arm64
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.3-noble@sha256:66520bcba471018a34fd54ba09be97ba4abebd950a96ff5cb8c2bf50a2d33259
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Load Android toolchain configuration
        id: android-toolchain
        run: |
          . Scripts/android-toolchain.sh
          swift_sdks_path="$HOME/.swiftpm/swift-sdks"
          swift_sdk_cache_path="$swift_sdks_path/${ANDROID_SWIFT_SDK_ID}.artifactbundle"
          android_ndk_home="$RUNNER_TEMP/$ANDROID_NDK_DIRECTORY_NAME"
          {
            echo "ANDROID_NDK_DIRECTORY_NAME=$ANDROID_NDK_DIRECTORY_NAME"
            echo "ANDROID_NDK_HOME=$android_ndk_home"
            echo "ANDROID_NDK_URL=$ANDROID_NDK_URL"
            echo "ANDROID_NDK_SHA1=$ANDROID_NDK_SHA1"
            echo "ANDROID_SWIFT_SDK_URL=$ANDROID_SWIFT_SDK_URL"
            echo "ANDROID_SWIFT_SDK_CHECKSUM=$ANDROID_SWIFT_SDK_CHECKSUM"
            echo "ANDROID_SWIFT_SDKS_PATH=$swift_sdks_path"
            echo "ANDROID_SWIFT_SDK_DIRECTORY=$swift_sdk_cache_path/swift-android"
          } >> "$GITHUB_ENV"
          {
            echo "apt_cache_epoch=$(date -u +%G-%V)"
            echo "ndk_cache_path=$android_ndk_home"
            echo "ndk_release=$ANDROID_NDK_RELEASE"
            echo "ndk_sha1=$ANDROID_NDK_SHA1"
            echo "swift_sdk_cache_path=$swift_sdk_cache_path"
            echo "swift_sdk_checksum=$ANDROID_SWIFT_SDK_CHECKSUM"
            echo "swift_version=$ANDROID_SWIFT_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Restore apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/apt-cache
          key: >-
            apt-v3-${{ runner.os }}-swift-6.3.3-noble-curl-unzip-${{
            steps.android-toolchain.outputs.apt_cache_epoch }}
          restore-keys: |
            apt-v3-${{ runner.os }}-swift-6.3.3-noble-curl-unzip-
      - name: Install archive tools
        run: |
          apt_cache_directory="$GITHUB_WORKSPACE/.build/apt-cache"
          mkdir -p "$apt_cache_directory/partial"
          apt-get update
          apt-get \
            -o Dir::Cache::archives="$apt_cache_directory" \
            install --yes --no-install-recommends curl unzip
      - name: Restore Swift Android SDK cache
        id: swift-android-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.android-toolchain.outputs.swift_sdk_cache_path }}
          key: >-
            swift-android-sdk-v1-${{ runner.os }}-${{
            steps.android-toolchain.outputs.swift_version }}-${{
            steps.android-toolchain.outputs.swift_sdk_checksum }}
      - name: Install Swift Android SDK
        if: steps.swift-android-sdk-cache.outputs.cache-hit != 'true'
        run: >-
          swift sdk install --swift-sdks-path "$ANDROID_SWIFT_SDKS_PATH"
          "$ANDROID_SWIFT_SDK_URL"
          --checksum "$ANDROID_SWIFT_SDK_CHECKSUM"
      - name: Restore Android NDK cache
        id: android-ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.android-toolchain.outputs.ndk_cache_path }}
          key: >-
            android-ndk-v1-${{ runner.os }}-${{
            steps.android-toolchain.outputs.ndk_release }}-${{
            steps.android-toolchain.outputs.ndk_sha1 }}
      - name: Install Android NDK
        if: steps.android-ndk-cache.outputs.cache-hit != 'true'
        run: |
          ndk_archive="${RUNNER_TEMP}/${ANDROID_NDK_DIRECTORY_NAME}-linux.zip"
          curl --fail --location --retry 3 \
            --output "$ndk_archive" \
            "$ANDROID_NDK_URL"
          echo "$ANDROID_NDK_SHA1  $ndk_archive" | sha1sum --check --strict
          unzip -q "$ndk_archive" -d "$RUNNER_TEMP"
      - name: Verify Android NDK
        run: |
          test -d "$ANDROID_NDK_HOME"
      - name: Configure Swift Android SDK
        run: |
          cd "$ANDROID_SWIFT_SDK_DIRECTORY"
          ./scripts/setup-android-sdk.sh
      - name: Cross-build Android smoke executable
        run: Scripts/validate-android.sh
  ci-required:
    name: CI required
    if: always()
    needs:
      - workflow-lint
      - minimum-macos
      - current-macos
      - linux
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if test "$result" != success; then
              echo "A required CI job concluded with: $result" >&2
              exit 1
            fi
          done
